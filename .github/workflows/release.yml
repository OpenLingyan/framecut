name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-preview:
    name: Build and publish unsigned preview
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v${version}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -s "docs/releases/${version}.md"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          ./scripts/check-repository-metadata.py

      - name: Set up packaging Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test-only media dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! brew list --versions ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Generate synthetic QA video
        run: |
          qa_video="$RUNNER_TEMP/framecut-qa/qa-sample.mp4"
          ./scripts/generate-qa-video.sh "$qa_video"
          echo "FRAMECUT_QA_VIDEO=$qa_video" >> "$GITHUB_ENV"
          echo "FRAMECUT_CONTENT_QA_VIDEO=$qa_video" >> "$GITHUB_ENV"
          echo "FRAMECUT_COMPATIBILITY_QA_VIDEO=$qa_video" >> "$GITHUB_ENV"

      - name: Check scripts and run complete test suite
        run: |
          for shell_script in scripts/*.sh; do zsh -n "$shell_script"; done
          python3 scripts/check-localizations.py
          swift test

      - name: Package and verify Universal 2 installers
        run: |
          ./scripts/package-release.sh
          codesign --verify --deep --strict --verbose=2 dist/FrameCut.app
          lipo dist/FrameCut.app/Contents/MacOS/FrameCut -verify_arch arm64 x86_64
          for extension in dmg zip; do
            (cd dist && shasum -a 256 -c "FrameCut-${RELEASE_VERSION}-macOS-universal2-unsigned.${extension}.sha256")
          done

      - name: Upload assets and publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prefix="dist/FrameCut-${RELEASE_VERSION}-macOS-universal2-unsigned"
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --prerelease --latest=false \
            --title "FrameCut ${RELEASE_VERSION} (Unsigned Preview)" \
            --notes-file "docs/releases/${RELEASE_VERSION}.md" \
            "${prefix}.dmg" "${prefix}.dmg.sha256" \
            "${prefix}.zip" "${prefix}.zip.sha256"
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = "4"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
